name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Show Flutter & Dart version
        run: |
          flutter --version
          dart --version
          yes | flutter doctor --android-licenses || true
          flutter doctor -v

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Analyze Flutter Code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Configure local.properties & permissions
        run: |
          mkdir -p android
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          cat android/local.properties
          chmod +x android/gradlew || true

      - name: Build APK (Release)
        run: |
          set +e
          flutter clean
          flutter pub get
          flutter build apk --release --verbose > build_verbose.log 2>&1
          BUILD_STATUS=$?
          echo "BUILD STATUS CODE: $BUILD_STATUS"
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "========== BUILD FAILED. LAST 100 LINES OF LOG =========="
            tail -n 100 build_verbose.log
            echo "======================================================="
            gh release create "build-error-log" build_verbose.log --title "Build Error Log" --notes "Build failed with exit code $BUILD_STATUS" --clobber || true
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare APK Files
        run: |
          mkdir -p release_apks
          find . -name "*.apk" -ls
          cp build/app/outputs/flutter-apk/app-release.apk release_apks/ABS-Hisab-Manager-2.apk || find . -name "*release*.apk" -exec cp {} release_apks/ABS-Hisab-Manager-2.apk \;
          cp release_apks/ABS-Hisab-Manager-2.apk release_apks/app-release.apk
          ls -lh release_apks/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ABS-Hisab-Manager-2-APK
          path: release_apks/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release v2.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0
          name: "ABS Hisab Manager-2 (Latest Release)"
          make_latest: true
          body: |
            ## 📱 ABS Hisab Manager-2 (Android APK)

            Direct APK Download Links:
            - **[ABS-Hisab-Manager-2.apk](https://github.com/abubakar28oc77/ABS-Hisab-Manager/releases/download/v2.0/ABS-Hisab-Manager-2.apk)**
            - **[app-release.apk](https://github.com/abubakar28oc77/ABS-Hisab-Manager/releases/download/v2.0/app-release.apk)**
          files: |
            release_apks/ABS-Hisab-Manager-2.apk
            release_apks/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release v2.${{ github.run_number }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.${{ github.run_number }}
          name: "ABS Hisab Manager-2 v2.${{ github.run_number }}"
          body: |
            ## 📱 ABS Hisab Manager-2 (Android APK)

            Direct APK Download Links:
            - **[ABS-Hisab-Manager-2.apk](https://github.com/abubakar28oc77/ABS-Hisab-Manager/releases/download/v2.${{ github.run_number }}/ABS-Hisab-Manager-2.apk)**
            - **[app-release.apk](https://github.com/abubakar28oc77/ABS-Hisab-Manager/releases/download/v2.${{ github.run_number }}/app-release.apk)**
          files: |
            release_apks/ABS-Hisab-Manager-2.apk
            release_apks/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
