name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Verify Flutter & Dart
        run: |
          flutter --version
          dart --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Android SDK
        run: |
          mkdir -p android
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          chmod +x android/gradlew || true

      - name: Build Release APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation -v > build_full.log 2>&1
          BUILD_CODE=$?
          echo "Flutter Build Exit Code: $BUILD_CODE"
          if [ $BUILD_CODE -ne 0 ]; then
            echo "Build failed, saving log artifact and release..."
            tail -n 250 build_full.log > build_error_snippet.log
            cat build_error_snippet.log
            gh release delete build-error-log --yes || true
            git push origin :refs/tags/build-error-log || true
            gh release create "build-error-log" build_error_snippet.log build_full.log --title "Build Error Log" --notes "Build failed with exit code $BUILD_CODE" --clobber || true
            exit 1
          fi

      - name: Prepare APK Files
        run: |
          mkdir -p release_apks
          cp build/app/outputs/flutter-apk/app-release.apk release_apks/ABS-Hisab-Manager-2.apk
          cp build/app/outputs/flutter-apk/app-release.apk release_apks/app-release.apk
          ls -lh release_apks/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ABS-Hisab-Manager-2-APK
          path: release_apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release v2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v2.0 --yes || true
          git push origin :refs/tags/v2.0 || true
          gh release create v2.0 release_apks/ABS-Hisab-Manager-2.apk release_apks/app-release.apk \
            --title "ABS Hisab Manager-2 (Latest Release)" \
            --notes "## 📱 ABS Hisab Manager-2 (Android APK)

          Direct Download Links:
          - **[ABS-Hisab-Manager-2.apk](https://github.com/abubakar28oc77/ABS-Hisab-Manager/releases/download/v2.0/ABS-Hisab-Manager-2.apk)**
          - **[app-release.apk](https://github.com/abubakar28oc77/ABS-Hisab-Manager/releases/download/v2.0/app-release.apk)**"

      - name: Publish GitHub Release v2.${{ github.run_number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v2.${{ github.run_number }}" release_apks/ABS-Hisab-Manager-2.apk release_apks/app-release.apk \
            --title "ABS Hisab Manager-2 v2.${{ github.run_number }}" \
            --notes "## 📱 ABS Hisab Manager-2 (Android APK)

          Direct Download Links:
          - **[ABS-Hisab-Manager-2.apk](https://github.com/abubakar28oc77/ABS-Hisab-Manager/releases/download/v2.${{ github.run_number }}/ABS-Hisab-Manager-2.apk)**
          - **[app-release.apk](https://github.com/abubakar28oc77/ABS-Hisab-Manager/releases/download/v2.${{ github.run_number }}/app-release.apk)**"
