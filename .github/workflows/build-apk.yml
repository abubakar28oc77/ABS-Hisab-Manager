name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Verify Flutter & Dart
        run: |
          flutter --version
          dart --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Android SDK
        run: |
          mkdir -p android
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          chmod +x android/gradlew || true

      - name: Build Release APK
        run: |
          mkdir -p release_apks logs
          echo "Starting Flutter release build..."
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation > logs/build.log 2>&1 || true
          cat logs/build.log | tail -n 50

          if [ ! -f build/app/outputs/flutter-apk/app-release.apk ] && [ ! -f android/app/build/outputs/apk/release/app-release.apk ]; then
            echo "Attempting direct Gradle assembleRelease..."
            cd android
            ./gradlew assembleRelease --stacktrace --no-daemon >> ../logs/build.log 2>&1 || true
            cd ..
          fi

          echo "Listing all generated APK files:"
          find . -name "*.apk" -ls

          find . -name "*release*.apk" -exec cp -v {} release_apks/ABS-Hisab-Manager-2.apk \;
          if [ ! -s release_apks/ABS-Hisab-Manager-2.apk ]; then
            echo "Copying any found APK as fallback..."
            find . -name "*.apk" -exec cp -v {} release_apks/ABS-Hisab-Manager-2.apk \;
          fi

          cp -v release_apks/ABS-Hisab-Manager-2.apk release_apks/app-release.apk || true
          ls -lh release_apks/ || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ABS-Hisab-Manager-2-APK
          path: release_apks/*.apk
          retention-days: 30

      - name: Publish Diagnostic Release (if APK missing)
        if: failure() || always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s release_apks/ABS-Hisab-Manager-2.apk ]; then
            echo "APK not found, creating diagnostic release diag-${{ github.run_number }}..."
            gh release create "diag-${{ github.run_number }}" logs/build.log --title "Diagnostic Log Run #${{ github.run_number }}" --notes "Build failed to generate APK. See attached log." || true
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s release_apks/ABS-Hisab-Manager-2.apk ]; then
            echo "Publishing releases..."
            gh release delete v2.0 --yes || true
            gh release create v2.0 release_apks/*.apk --title "ABS Hisab Manager-2" --notes "## 📱 ABS Hisab Manager-2 (Android APK)

            Direct Download Links:
            - **[ABS-Hisab-Manager-2.apk](https://github.com/abubakar28oc77/ABS-Hisab-Manager/releases/download/v2.0/ABS-Hisab-Manager-2.apk)**
            - **[app-release.apk](https://github.com/abubakar28oc77/ABS-Hisab-Manager/releases/download/v2.0/app-release.apk)**" || gh release upload v2.0 release_apks/*.apk --clobber || true

            gh release create "v2.${{ github.run_number }}" release_apks/*.apk --title "ABS Hisab Manager-2 v2.${{ github.run_number }}" --notes "## 📱 ABS Hisab Manager-2 (Android APK)

            Direct Download Links:
            - **[ABS-Hisab-Manager-2.apk](https://github.com/abubakar28oc77/ABS-Hisab-Manager/releases/download/v2.${{ github.run_number }}/ABS-Hisab-Manager-2.apk)**
            - **[app-release.apk](https://github.com/abubakar28oc77/ABS-Hisab-Manager/releases/download/v2.${{ github.run_number }}/app-release.apk)**" || true
          else
            echo "Skipping release because APK was not generated."
            exit 1
          fi

