name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Show Flutter & Dart version
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Analyze Flutter Code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Ensure Android Permissions and Keystore
        run: |
          chmod +x android/gradlew
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Android APK
        run: |
          set +e
          echo "Starting Flutter Build APK..." > build.log
          flutter build apk --release --verbose >> build.log 2>&1
          BUILD_STATUS=$?
          echo "Build exit code: $BUILD_STATUS" >> build.log
          mkdir -p release_apks
          find / -name "*.apk" -type f -exec cp -v {} release_apks/ 2>/dev/null \; || true
          ls -la release_apks/ >> build.log
          cat build.log | tail -n 100

      - name: Upload Build Log & APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ABS-Hisab-Manager-Build-Output
          path: |
            build.log
            release_apks/*
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -x
          TAG_NAME="v2.${{ github.run_number }}"
          gh release create "$TAG_NAME" release_apks/*.apk --title "ABS Hisab Manager-2 $TAG_NAME" --notes "### 📱 ABS Hisab Manager-2 (Android APK)\n\nDownload the APK file below and install on your Android device."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
