name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Show Flutter & Dart version
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Analyze Flutter Code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Configure local.properties & permissions
        run: |
          mkdir -p android
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          cat android/local.properties
          chmod +x android/gradlew || true

      - name: Build APK (Release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-Build-Log
          path: flutter_build.log
          retention-days: 7

      - name: Prepare APK Names
        run: |
          mkdir -p release_apks
          cp build/app/outputs/flutter-apk/app-release.apk release_apks/ABS-Hisab-Manager-2.apk
          cp build/app/outputs/flutter-apk/app-release.apk release_apks/app-release.apk
          ls -la release_apks/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ABS-Hisab-Manager-2-APK
          path: release_apks/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.${{ github.run_number }}
          name: "ABS Hisab Manager-2 v2.${{ github.run_number }}"
          make_latest: true
          body: |
            ## 📱 ABS Hisab Manager-2 (Android APK)

            Direct APK Download Links:
            - **[ABS-Hisab-Manager-2.apk](https://github.com/abubakar28oc77/ABS-Hisab-Manager/releases/download/v2.${{ github.run_number }}/ABS-Hisab-Manager-2.apk)**
            - **[app-release.apk](https://github.com/abubakar28oc77/ABS-Hisab-Manager/releases/download/v2.${{ github.run_number }}/app-release.apk)**

            Auto-built from commit: ${{ github.sha }}
          files: |
            release_apks/ABS-Hisab-Manager-2.apk
            release_apks/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false

      - name: Create or Update GitHub Release v2.0
        if: always()
        run: |
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            gh release create "v2.0" release_apks/*.apk --title "ABS Hisab Manager-2 (Latest Release)" --notes "Direct APK download for ABS Hisab Manager-2" || gh release upload "v2.0" release_apks/*.apk --clobber || true
            gh release create "v2.${{ github.run_number }}" release_apks/*.apk --title "ABS Hisab Manager-2 v2.${{ github.run_number }}" --notes "Auto-built from commit: ${{ github.sha }}" || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
