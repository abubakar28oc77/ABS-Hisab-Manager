name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Configure local.properties & permissions
        run: |
          mkdir -p android
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          chmod +x android/gradlew || true

      - name: Build APK (Release)
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee build_err.txt || (
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add build_err.txt
            git commit -m "Capture build error log" || true
            git push origin main || true
            exit 1
          )

      - name: Prepare APK Files
        run: |
          mkdir -p release_apks
          FOUND_APK=$(find . -name "*.apk" -type f | head -n 1)
          cp "$FOUND_APK" release_apks/ABS-Hisab-Manager-2.apk
          cp "$FOUND_APK" release_apks/app-release.apk
          ls -lh release_apks/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ABS-Hisab-Manager-2-APK
          path: release_apks/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release v2.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0
          name: "ABS Hisab Manager-2 (Latest Release)"
          make_latest: true
          body: |
            ## 📱 ABS Hisab Manager-2 (Android APK)

            Direct APK Download Links:
            - **[ABS-Hisab-Manager-2.apk](https://github.com/abubakar28oc77/ABS-Hisab-Manager/releases/download/v2.0/ABS-Hisab-Manager-2.apk)**
            - **[app-release.apk](https://github.com/abubakar28oc77/ABS-Hisab-Manager/releases/download/v2.0/app-release.apk)**
          files: |
            release_apks/ABS-Hisab-Manager-2.apk
            release_apks/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
