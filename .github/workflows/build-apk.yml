name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Verify Flutter & Dart
        run: |
          flutter --version
          dart --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Android SDK
        run: |
          mkdir -p android
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          chmod +x android/gradlew || true

      - name: Build APK (Release)
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation 2>&1 | tee flutter_build.log

      - name: Record Build Diagnostics
        if: always()
        run: |
          DIAG_MSG="Build status:
          $(tail -n 80 flutter_build.log)"
          gh release create "diag-${{ github.run_number }}" flutter_build.log --title "Diagnostics ${{ github.run_number }}" --notes "$DIAG_MSG" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare APK Files
        if: success()
        run: |
          mkdir -p release_apks
          cp build/app/outputs/flutter-apk/app-release.apk release_apks/ABS-Hisab-Manager-2.apk
          cp build/app/outputs/flutter-apk/app-release.apk release_apks/app-release.apk
          ls -lh release_apks/

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ABS-Hisab-Manager-2-APK
          path: release_apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release v2.0
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v2.0 release_apks/*.apk --title "ABS Hisab Manager-2 (Latest Release)" --notes "## 📱 ABS Hisab Manager-2 (Android APK)

          Direct Download Links:
          - **[ABS-Hisab-Manager-2.apk](https://github.com/abubakar28oc77/ABS-Hisab-Manager/releases/download/v2.0/ABS-Hisab-Manager-2.apk)**
          - **[app-release.apk](https://github.com/abubakar28oc77/ABS-Hisab-Manager/releases/download/v2.0/app-release.apk)**" --clobber || true

      - name: Publish GitHub Release v2.${{ github.run_number }}
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v2.${{ github.run_number }}" release_apks/*.apk --title "ABS Hisab Manager-2 v2.${{ github.run_number }}" --notes "## 📱 ABS Hisab Manager-2 (Android APK)

          Direct Download Links:
          - **[ABS-Hisab-Manager-2.apk](https://github.com/abubakar28oc77/ABS-Hisab-Manager/releases/download/v2.${{ github.run_number }}/ABS-Hisab-Manager-2.apk)**
          - **[app-release.apk](https://github.com/abubakar28oc77/ABS-Hisab-Manager/releases/download/v2.${{ github.run_number }}/app-release.apk)**" --clobber || true
